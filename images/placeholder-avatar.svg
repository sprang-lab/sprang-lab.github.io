<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Placeholder for people without a photo: night-blue disc, neon-gradient silhouette -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#1a2a5c"/>
      <stop offset="100%" stop-color="#0b1430"/>
    </radialGradient>
    <linearGradient id="fig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19e3ff"/>
      <stop offset="100%" stop-color="#ff2bd6"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <g clip-path="url(#disc)" fill="url(#fig)" fill-opacity="0.55" stroke="url(#fig)" stroke-width="2.5" stroke-opacity="0.9">
    <circle cx="100" cy="80" r="33"/>
    <ellipse cx="100" cy="172" rx="56" ry="50"/>
  </g>
</svg>
